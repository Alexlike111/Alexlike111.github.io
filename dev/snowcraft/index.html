<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SNOWCRAFT</title>
  <meta name="description" content="SNOWCRAFT: пиксельная песочница выживания во льдах. Каждый пиксель — вещество." />
  <style>
    /* no page scroll, no bounce, no long-press menu / magnifier / text selection on the game (requirements 1.4.5, 1.6.3); text fields and the self-test report stay selectable */
    html,body{margin:0;height:100%;background:#0b1220;color:#e6eef7;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    #stage{position:fixed;inset:0;overflow:hidden}                /* the field is clipped to the window: the document never grows past it */
    #stage canvas{display:block}
    #stage,#ui{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    input,textarea,select,[contenteditable],[data-allow-select]{-webkit-user-select:text;user-select:text}
  </style>
</head>
<body>
  <div id="stage"><canvas id="world"></canvas></div>
  <div id="ui"></div>
  <noscript>Для игры нужен JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
