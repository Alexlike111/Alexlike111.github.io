<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>Smash Circuit - Track Editor (dev only)</title>
    <style>
      :root { --bg: #14202b; --panel: #1c2b39; --panel2: #243648; --line: #34506a; --fg: #e8f0f7; --dim: #93a8bb; --acc: #ffc93c; --ok: #3ccf6e; --bad: #ff5a36; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
      #panel { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 12px; overflow-y: auto; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
      .sub { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
      label { display: grid; grid-template-columns: 82px 1fr; gap: 6px; align-items: center; margin: 4px 0; color: var(--dim); }
      input, select, textarea, button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; min-width: 0; }
      button { cursor: pointer; padding: 5px 9px; }
      button:hover { border-color: var(--acc); }
      button.on { background: var(--acc); color: #1b2a3a; border-color: var(--acc); font-weight: 600; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      .row > button { flex: 1 1 auto; }
      #palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
      #palette button { padding: 4px 2px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px; }
      #palette i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #0006; }
      textarea { width: 100%; height: 130px; font: 11px/1.3 ui-monospace, monospace; resize: vertical; }
      #stats { background: var(--panel2); border-radius: 6px; padding: 8px; font-variant-numeric: tabular-nums; }
      #stats div { display: flex; justify-content: space-between; gap: 8px; }
      #verdict { font-weight: 700; margin-bottom: 4px; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      #msg { min-height: 16px; color: var(--acc); margin-top: 6px; }
      #stage { position: relative; min-width: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
      #hint { position: absolute; left: 10px; bottom: 8px; background: #0009; border-radius: 6px; padding: 4px 8px; color: var(--dim); font-size: 11px; pointer-events: none; }
      kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--fg); }
    </style>
  </head>
  <body oncontextmenu="return false">
    <div id="app">
      <div id="panel">
        <h1>Track editor</h1>
        <div class="sub">Dev tool. Not part of the production build. Nothing is saved: export before leaving.</div>

        <h2>Track</h2>
        <label>Load <select id="trackSel"></select></label>
        <label>id <input id="fId" /></label>
        <label>nameKey <input id="fName" /></label>
        <label>theme <select id="fTheme"><option>meadow</option><option>desert</option><option>snow</option></select></label>
        <label>wall style <select id="fWall"><option>concrete</option><option>tires</option><option>fence</option></select></label>
        <label>laps <input id="fLaps" type="number" min="1" max="9" step="1" /></label>
        <label>width (m) <input id="fWidth" type="number" min="6" max="24" step="0.5" /></label>

        <h2>Tool</h2>
        <div class="row"><button id="toolPoints">Points (1)</button><button id="toolProps">Props (2)</button></div>
        <div id="palette"></div>
        <label>angle (deg) <input id="fAngle" type="number" step="5" disabled /></label>
        <div class="row">
          <button id="btnStart" title="S">Set start at point</button>
          <button id="btnDel" title="Delete">Delete selected</button>
        </div>
        <div class="row">
          <button id="btnUndo" title="Ctrl+Z">Undo</button><button id="btnRedo" title="Ctrl+Y">Redo</button>
          <button id="btnFit" title="0">Fit view</button>
        </div>
        <div class="row">
          <button id="btnAuto" title="Replace ALL props with auto-generated dressing">Auto props</button>
          <button id="btnClear">Clear props</button>
          <button id="btnFlip" title="Mirror the view vertically">Flip Y: <span id="flipState">up</span></button>
        </div>

        <h2>Validation</h2>
        <div id="stats"></div>

        <h2>Export / import (TrackDef JSON)</h2>
        <div class="row"><button id="btnCopy">Copy JSON</button><button id="btnDl">Download</button><button id="btnShow">Show JSON</button></div>
        <textarea id="json" spellcheck="false" placeholder="TrackDef JSON. Paste here and press Import."></textarea>
        <div class="row"><button id="btnImport">Import from box</button></div>
        <div id="msg"></div>
      </div>
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="hint">
          Points: <kbd>click</kbd> add, drag move, <kbd>right-click</kbd>/<kbd>Del</kbd> remove &nbsp;|&nbsp; pan: middle mouse or <kbd>Space</kbd>+drag &nbsp;|&nbsp; wheel zoom &nbsp;|&nbsp; <kbd>Q</kbd>/<kbd>E</kbd> rotate prop
        </div>
      </div>
    </div>
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
